# Optional build trust for the managed Codex HTTPS proxy. No certificate or
# credential value is stored in the repository or copied into image layers.
services:
  backend:
    build:
      secrets:
        - proxy_ca
  frontend:
    build:
      secrets:
        - proxy_ca
  tests:
    build:
      secrets:
        - proxy_ca
secrets:
  proxy_ca:
    file: ${CODEX_PROXY_CERT:?Use este override somente no Codex com CODEX_PROXY_CERT configurado}
